<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Movies — Wanzu Films</title>
  <style>
    :root {
      --bg-dark: #030a16;
      --bg-card: #0a172c;
      --bg-elevated: #0f203c;
      --border-color: #1e293b;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 60px;
    }

    .navbar {
      background-color: #030a16;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      color: #ffffff;
      text-decoration: none;
    }

    .brand span { color: var(--accent-cyan); }

    .back-link {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      color: var(--accent-cyan);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    /* Video Player */
    .player-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2.5rem;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background-color: #000;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
    }

    .player-info {
      padding: 1rem 1.25rem;
    }

    .movie-badge {
      color: var(--accent-cyan);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    /* Movie List */
    .section-title {
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .movie-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .movie-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      gap: 1.25rem;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .movie-card:hover, .movie-card.active {
      border-color: var(--accent-cyan);
      background-color: var(--bg-elevated);
    }

    .movie-poster {
      width: 90px;
      height: 130px;
      object-fit: cover;
      border-radius: 6px;
      background-color: var(--bg-elevated);
      flex-shrink: 0;
    }

    .movie-details {
      flex-grow: 1;
    }

    .movie-title {
      color: #ffffff;
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
    }

    .movie-meta {
      color: var(--accent-cyan);
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .movie-desc {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .play-btn {
      background-color: var(--accent-cyan);
      color: var(--bg-dark);
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {
      .movie-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .movie-poster {
        width: 100%;
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand">WANZU <span>FILMS</span></a>
    <a href="index.html" class="back-link">← Home</a>
  </header>

  <main class="container">
    <h1>Action Movies</h1>
    <p class="subtitle">Single Feature Films Collection</p>

    <!-- Video Player -->
    <div class="player-card">
      <div class="video-wrapper">
        <video id="videoPlayer" controls controlsList="nodownload">
          <source id="videoSource" src="https://your-server.com/movies/john_wick.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
      <div class="player-info">
        <span class="movie-badge" id="nowPlayingMeta">2014 • 1h 41m • ACTION / THRILLER</span>
        <h2 id="nowPlayingTitle" style="color: #ffffff; margin-top: 0.25rem;">John Wick</h2>
      </div>
    </div>

    <!-- Movie List -->
    <h2 class="section-title">All Action Movies</h2>
    <div class="movie-list" id="movieList">
      <!-- Movies dynamically rendered here -->
    </div>
  </main>

  <script>
    // List of Single Action Movies - Replace "url" with your direct film link (.mp4)
    const movies = [
      {
        id: 1,
        title: "John Wick",
        meta: "2014 • 1h 41m • Action / Thriller",
        desc: "An ex-hitman comes out of retirement to track down the gangsters that took everything from him.",
        poster: "https://via.placeholder.com/90x130/0a172c/38bdf8?text=JOHN+WICK",
        url: "https://your-server.com/movies/john_wick.mp4"
      },
      {
        id: 2,
        title: "Extraction",
        meta: "2020 • 1h 56m • Action / Combat",
        desc: "A hardened mercenary's mission becomes a race to survive when he is sent to rescue a kidnapped boy.",
        poster: "https://via.placeholder.com/90x130/0a172c/38bdf8?text=EXTRACTION",
        url: "https://your-server.com/movies/extraction.mp4"
      },
      {
        id: 3,
        title: "Mad Max: Fury Road",
        meta: "2015 • 2h 00m • Sci-Fi / Action",
        desc: "In a post-apocalyptic wasteland, a woman rebels against a tyrannical ruler in search for her homeland.",
        poster: "https://via.placeholder.com/90x130/0a172c/38bdf8?text=MAD+MAX",
        url: "https://your-server.com/movies/mad_max.mp4"
      },
      {
        id: 4,
        title: "The Raid: Redemption",
        meta: "2011 • 1h 41m • Martial Arts / Action",
        desc: "A SWAT team becomes trapped in a high-rise building run by a ruthless mobster and his army of killers.",
        poster: "https://via.placeholder.com/90x130/0a172c/38bdf8?text=THE+RAID",
        url: "https://your-server.com/movies/the_raid.mp4"
      }
    ];

    let activeMovieIndex = 0;

    function renderMovies() {
      const container = document.getElementById('movieList');
      container.innerHTML = '';

      movies.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `movie-card ${index === activeMovieIndex ? 'active' : ''}`;
        card.onclick = () => playMovie(index);

        card.innerHTML = `
          <img class="movie-poster" src="${item.poster}" alt="${item.title}">
          <div class="movie-details">
            <h3 class="movie-title">${item.title}</h3>
            <div class="movie-meta">${item.meta}</div>
            <p class="movie-desc">${item.desc}</p>
          </div>
          <button class="play-btn">Play</button>
        `;

        container.appendChild(card);
      });
    }

    function playMovie(index) {
      activeMovieIndex = index;
      const movie = movies[index];

      const player = document.getElementById('videoPlayer');
      const source = document.getElementById('videoSource');

      source.src = movie.url;
      player.load();
      player.play();

      document.getElementById('nowPlayingTitle').innerText = movie.title;
      document.getElementById('nowPlayingMeta').innerText = movie.meta;

      renderMovies();
    }

    renderMovies();
  </script>

</body>
</html>
