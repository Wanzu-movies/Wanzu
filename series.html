<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wanzu Films — Series Portal</title>
  <style>
    :root {
      --bg-dark: #030a16;
      --bg-card: #0a172c;
      --bg-elevated: #0f203c;
      --border-color: #1e293b;
      --border-accent: rgba(56, 189, 248, 0.3);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-cyan-hover: #7dd3fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navbar */
    .navbar {
      background-color: rgba(3, 10, 22, 0.95);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .brand span {
      color: var(--accent-cyan);
    }

    .back-btn {
      background-color: var(--bg-elevated);
      color: var(--accent-cyan);
      border: 1px solid var(--border-accent);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      display: none;
    }

    .back-btn:hover {
      background-color: var(--accent-cyan);
      color: var(--bg-dark);
    }

    /* Common Container */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .section-title {
      font-size: 1.75rem;
      color: #ffffff;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    /* Series Grid (Level 1) */
    .series-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .series-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .series-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .series-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background-color: var(--bg-elevated);
    }

    .series-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .series-badge {
      font-size: 0.75rem;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
    }

    .series-name {
      font-size: 1.1rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    .series-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Episode View (Level 2) */
    #episodesView {
      display: none;
    }

    .hero-details {
      margin-bottom: 2rem;
    }

    .hero-details h1 {
      font-size: 2.2rem;
      color: #ffffff;
    }

    .hero-meta {
      color: var(--accent-cyan);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    /* Player */
    .player-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2.5rem;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-info {
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn {
      background-color: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Episode Grid */
    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }

    .ep-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ep-card:hover {
      border-color: var(--accent-cyan);
      background-color: var(--bg-elevated);
    }

    .ep-card.active {
      border-color: var(--accent-cyan);
      background-color: var(--bg-elevated);
    }

    .ep-badge {
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 700;
    }

    .ep-title {
      color: #ffffff;
      font-size: 0.95rem;
      margin: 0.25rem 0;
    }

    .ep-desc {
      color: var(--text-muted);
      font-size: 0.8rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <div class="brand" onclick="showCatalog()">WANZU <span>FILMS</span></div>
      <button class="back-btn" id="backBtn" onclick="showCatalog()">← Back to All Series</button>
    </div>
  </header>

  <!-- Level 1: All Series View -->
  <main class="container" id="catalogView">
    <h2 class="section-title">Select a Series</h2>
    <div class="series-grid" id="seriesGrid"></div>
  </main>

  <!-- Level 2: Individual Series & Episodes View -->
  <main class="container" id="episodesView">
    <div class="hero-details">
      <div class="hero-meta" id="seriesGenre">GENRE</div>
      <h1 id="seriesTitle">Series Title</h1>
      <p id="seriesDesc" style="color: var(--text-muted); margin-top: 0.5rem;"></p>
    </div>

    <!-- Video Player -->
    <div class="player-card">
      <div class="video-wrapper">
        <iframe id="videoPlayer" src="" allowfullscreen></iframe>
      </div>
      <div class="player-info">
        <div>
          <span class="ep-badge" id="nowPlayingBadge">EPISODE 1</span>
          <h3 id="nowPlayingTitle" style="color:#ffffff;">Episode Title</h3>
        </div>
        <div>
          <button class="btn" onclick="prevEpisode()">Previous</button>
          <button class="btn" onclick="nextEpisode()">Next</button>
        </div>
      </div>
    </div>

    <h3 class="section-title">All Episodes</h3>
    <div class="episode-grid" id="episodeGrid"></div>
  </main>

  <script>
    // Series Database
    const seriesData = [
      {
        id: "jumong",
        name: "Jumong (주몽)",
        genre: "Historical Epic • 40 Episodes",
        desc: "The legendary story of Prince Jumong, who defeats the Han Empire to found the ancient Kingdom of Goguryeo.",
        poster: "https://via.placeholder.com/240x360/0a172c/38bdf8?text=JUMONG",
        totalEpisodes: 40,
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      {
        id: "evernight",
        name: "Ever Night (장야)",
        genre: "Wuxia Fantasy • 60 Episodes",
        desc: "Ning Que fights to protect his companion Sang Sang and uncovers ancient martial mysteries.",
        poster: "https://via.placeholder.com/240x360/0a172c/38bdf8?text=EVER+NIGHT",
        totalEpisodes: 60,
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      },
      {
        id: "firstfive",
        name: "First Five",
        genre: "Action Thriller • 30 Episodes",
        desc: "An elite operative squad unites to dismantle an underground Syndicate operating in the shadows.",
        poster: "https://via.placeholder.com/240x360/0a172c/38bdf8?text=FIRST+FIVE",
        totalEpisodes: 30,
        embedUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
      }
    ];

    let currentSeries = null;
    let currentEpisodeIndex = 0;

    // Render Series List
    function renderCatalog() {
      const grid = document.getElementById('seriesGrid');
      grid.innerHTML = '';

      seriesData.forEach(series => {
        const card = document.createElement('div');
        card.className = 'series-card';
        card.onclick = () => openSeries(series.id);

        card.innerHTML = `
          <img class="series-poster" src="${series.poster}" alt="${series.name}">
          <div class="series-info">
            <span class="series-badge">${series.genre}</span>
            <h3 class="series-name">${series.name}</h3>
            <p class="series-desc">${series.desc}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Open Selected Series
    function openSeries(seriesId) {
      currentSeries = seriesData.find(s => s.id === seriesId);
      currentEpisodeIndex = 0;

      document.getElementById('catalogView').style.display = 'none';
      document.getElementById('episodesView').style.display = 'block';
      document.getElementById('backBtn').style.display = 'inline-block';

      document.getElementById('seriesTitle').innerText = currentSeries.name;
      document.getElementById('seriesGenre').innerText = currentSeries.genre;
      document.getElementById('seriesDesc').innerText = currentSeries.desc;

      renderEpisodes();
      playEpisode(0);
    }

    // Return to Series Catalog
    function showCatalog() {
      document.getElementById('catalogView').style.display = 'block';
      document.getElementById('episodesView').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
      document.getElementById('videoPlayer').src = '';
    }

    // Render Episode List
    function renderEpisodes() {
      const grid = document.getElementById('episodeGrid');
      grid.innerHTML = '';

      for (let i = 1; i <= currentSeries.totalEpisodes; i++) {
        const index = i - 1;
        const card = document.createElement('div');
        card.className = `ep-card ${index === currentEpisodeIndex ? 'active' : ''}`;
        card.onclick = () => playEpisode(index);

        card.innerHTML = `
          <span class="ep-badge">EPISODE ${i}</span>
          <h4 class="ep-title">${currentSeries.name} - Ep ${i}</h4>
          <p class="ep-desc">Official full stream for episode ${i} of ${currentSeries.name}.</p>
        `;

        grid.appendChild(card);
      }
    }

    // Play Specific Episode
    function playEpisode(index) {
      currentEpisodeIndex = index;
      const epNum = index + 1;

      document.getElementById('videoPlayer').src = currentSeries.embedUrl;
      document.getElementById('nowPlayingBadge').innerText = `EPISODE ${epNum}`;
      document.getElementById('nowPlayingTitle').innerText = `${currentSeries.name} - Episode ${epNum}`;

      renderEpisodes();
    }

    function prevEpisode() {
      if (currentEpisodeIndex > 0) {
        playEpisode(currentEpisodeIndex - 1);
      }
    }

    function nextEpisode() {
      if (currentEpisodeIndex < currentSeries.totalEpisodes - 1) {
        playEpisode(currentEpisodeIndex + 1);
      }
    }

    // Init
    renderCatalog();
  </script>
</body>
</html>
